# ADAAAA-7769: decide routing layer.
#
# The highlights server talks to exactly ONE decide origin (`DECIDE_URL`), so
# adding a second decide worker is a pure capacity change: no change to the 3 s
# decide window, the cadence, or the detection contract. This proxy spreads each
# decide HTTP request across the two decide workers (`decide` on GPU 1,
# `decide-b` on GPU 0) with `least_conn`, i.e. the request goes to the worker
# with the fewest in-flight decide calls.
#
# Single-worker fallback: each upstream marks itself unavailable after
# `max_fails` consecutive connection/timeout failures for `fail_timeout`, and
# `proxy_next_upstream` retries a failed request on the remaining backend, so a
# dead or OOM'd worker degrades to the old single-decide behaviour instead of
# failing decides outright.
#
# ADAAAA-8083: the upstream names MUST be re-resolved while nginx runs. Without
# `resolve`, nginx resolves `decide` / `decide-b` ONCE at startup and keeps
# dialling those bridge IPs forever, so every `docker compose up -d` that
# recreates a decide worker leaves the pool pointed at a dead address. The
# failure is not silent: connecting to an address no container owns waits out
# ARP and returns `connect() failed (113: Host is unreachable)` after ~3 s, so
# after `fail_timeout` (10 s) the dead peer is re-enabled and the next request
# pays that ~3 s stall again — a 3 s stall every 10 s, forever.
#
# That stall is what killed the decide leg: go-livepeer's static-runner health
# probe (3 s timeout) intermittently timed out, marked the runner `unavailable`,
# and released every in-flight decide session, so the server's decide call came
# back `404 runner not found / session not found` and a job died at 68-100 %
# (`decide runner unavailable after 5 attempts`, ADAAAA-8083). `resolve` +
# Docker's embedded DNS keeps the pool on the live container IPs (re-checked
# every `valid`), so the stall and the session-release class cannot recur.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
}

http {
  access_log /dev/stdout;

  # Decide request bodies carry up to ~30 base64 frames + crops + one audio
  # window; keep this well above the largest observed payload.
  client_max_body_size 256m;

  # Docker's embedded DNS (serves every compose service name on the network).
  # `valid=10s` bounds how long a recreated worker's OLD IP can still be dialled.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream decide_pool {
    # `resolve` requires a shared memory zone so the resolved addresses can be
    # updated by the resolver callbacks (nginx >= 1.27.3).
    zone decide_pool 64k;
    least_conn;
    server decide:8081   resolve max_fails=2 fail_timeout=10s;
    server decide-b:8081 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
  }

  # Router-local liveness endpoint (NOT a decide path): used by the compose
  # healthcheck so a healthy router is distinguishable from a healthy worker.
  server {
    listen 8081;
    location = /nginx-health {
      access_log off;
      add_header Content-Type text/plain always;
      return 200 "ok\n";
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # One retry on the OTHER decide worker if a backend is down / OOM'd.
      proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout 5s;

      # Decide calls are long: 8-25 s wall per window at 4 concurrent sequences,
      # plus the Stage-2 confirm pass. Allow generous read/send windows so a slow
      # decide is not turned into a proxy 504 (which the server would count as a
      # failed decide).
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;

      proxy_pass http://decide_pool;
    }
  }
}
