name: highlights-live

# Local OFFCHAIN lab stack. The go-livepeer orchestrator reverse-proxies the
# two highlight live-runners (persistent perceive + single-shot decide). No
# remote signer here — offchain skips payments. Add `profiles: [signer]` service
# for the on-chain path (see infra/railway).
#
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.e2e.yml run e2e
services:
  orchestrator:
    image: livepeer/go-livepeer:v0.9.2
    container_name: highlights-orchestrator
    command:
      - -orchestrator
      - -useLiveRunners
      - -liveRunnerConfig=/config/runners.json
      - -serviceAddr=https://orchestrator:8935
      - -httpAddr=0.0.0.0:8935
      - -liveRunnerAddr=https://orchestrator:8935
      - -orchSecret=${ORCHESTRATOR_SECRET:-highlights-secret}
      - -network=offchain
      - -monitor=false
      - -v=6
    ports:
      - "8935:8935"
    volumes:
      - ./runners.json:/config/runners.json:ro
    healthcheck:
      test: ["CMD-SHELL", "openssl s_client -connect 127.0.0.1:8935 </dev/null 2>/dev/null | grep -q CONNECTED"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks: [hl]

  perceive:
    build:
      context: ..
      dockerfile: docker/Dockerfile.perceive
    container_name: highlights-perceive
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [hl]

  # Gemma 4 12B QAT (google/gemma-4-12B-it-qat-q4_0-gguf) — the DECIDE VLM and
  # (future) browser-available "context engine". llama.cpp `llama-server`
  # exposes OpenAI /v1/chat/completions natively (what services/decide's
  # gemma.py calls), with the mmproj vision projector so it sees the frame
  # sequence + audio per the Gemma 4 12B video/audio modality-order guidance.
  # SMALL/dense q4_0 QAT fits an RTX 5060 Ti on .6 with a decent ctx.
  #
  # Blackwell (sm_120/121) note: stock llama.cpp CUDA images may lack Blackwell
  # kernels — if the prebuilt image fails to load, build from source like the
  # video-creator gemma-worker.Dockerfile (llama-cpp-python, CMAKE_CUDA_ARCHS
  # for the card). Operator bind-mounts the already-downloaded GGUF + mmproj at
  # ./models/ (see docs/plan/03-decide-runner.md).
  gemma:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: highlights-gemma
    entrypoint: [""]
    command:
      - llama-server
      - --model
      - /models/gemma-4-12b-it-qat-q4_0.gguf
      - --mmproj
      - /models/mmproj-gemma-4-12b-it-qat-q4_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8088"
      - --ctx-size
      - "16384" # q4_0 12B + vision tokens: comfortable room for a frame window + audio
    volumes:
      - ./models:/models:ro
    expose: ["8088"] # only on the private hl network (decide talks to it)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [hl]

  decide:
    build:
      context: ..
      dockerfile: docker/Dockerfile.decide
    container_name: highlights-decide
    expose: ["8081"]
    # Real Gemma 4 12B QAT via the in-compose gemma llama-server (see
    # docs/plan/03-decide-runner.md). DECIDE_MODE=rule falls back to the stub.
    environment:
      - DECIDE_MODE=${DECIDE_MODE:-gemma}
      - GEMMA_URL=${GEMMA_URL:-http://gemma:8088}
      - GEMMA_MODEL=${GEMMA_MODEL:-gemma-4-12b-it-qat-q4_0}
    depends_on:
      gemma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [hl]

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: highlights-server
    environment:
      - PORT=3000
      - ORCHESTRATOR_URL=https://orchestrator:8935
      - DATA_DIR=/data
      - FFMPEG_PATH=ffmpeg
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - JWT_SECRET=dev-secret
      - ADMIN_EMAIL=admin@highlights.local
      - ADMIN_PASSWORD=admin
      - FREE_HIGHLIGHTS=3
      - BILLING_WIREFRAME=1
      # Production-shaped stack: server persists to the separate Postgres
      # container. No DATABASE_URL (plain `npm run dev`, no compose) -> SQLite.
      - DATABASE_URL=postgres://${POSTGRES_USER:-highlights}:${POSTGRES_PASSWORD:-highlights}@postgres:5432/${POSTGRES_DB:-highlights}
      # Media-path (b): the browser streams frames to the media server instead
      # of the server's HTTP /ingest when this is set.
      - MEDIA_SERVER_URL=${MEDIA_SERVER_URL:-http://media:4070}
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    depends_on:
      orchestrator:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks: [hl]

  # Postgres runs as its OWN container (separate from the server), with a
  # dedicated named volume for persistence. The server reaches it at
  # `postgres:5432` over the private hl network. PgDb auto-creates the schema
  # (CREATE TABLE IF NOT EXISTS) on startup.
  postgres:
    image: postgres:18
    container_name: highlights-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-highlights}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-highlights}
      - POSTGRES_DB=${POSTGRES_DB:-highlights}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-highlights} -d ${POSTGRES_DB:-highlights}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [hl]

  # Media server: the payer/broadcaster. The browser streams sampled frames
  # over its WS, it publishes them to the orchestrator's video-in rail and POSTs
  # the runner's observations back to the server at /jobs/:id/observe. Pays the
  # orchestrator while a stream is open (no-op offchain). NODE_TLS...=0 because
  # the orchestrator presents a self-signed cert on this lab box.
  media:
    build:
      context: ..
      dockerfile: docker/Dockerfile.media
    container_name: highlights-media
    environment:
      - PORT=4070
      - ORCHESTRATOR_URL=https://orchestrator:8935
      - CALLBACK_URL=http://server:3000
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - SIGNER_URL=${SIGNER_URL:-}
      - PAYER_ADDRESS=${PAYER_ADDRESS:-}
      # Public LB / Cloudflare front for the media tier. The media server returns
      # this as the FULL ws ingest URL on provision so clients can be routed by
      # the load balancer rather than assuming a path on one node.
      - MEDIA_PUBLIC_BASE_URL=${MEDIA_PUBLIC_BASE_URL:-https://highlights-media.dpn.gg}
      # Release a provisioned-but-never-used perceive slot after this long.
      - MEDIA_PROVISION_NO_CLIENT_MS=${MEDIA_PROVISION_NO_CLIENT_MS:-60000}
    ports:
      - "4070:4070"
    depends_on:
      orchestrator:
        condition: service_healthy
      server:
        condition: service_started
    networks: [hl]

  # go-livepeer REMOTE SIGNER (on-chain path only). Holds the ETH keystore.
  # - `profiles: [signer]` -> NOT started by the default offchain `up`.
  # - NO `ports:` -> reachable only on the private `hl` network (== no external
  #   access). On Railway this service gets no public domain; the server reaches
  #   it via internal routing instead.
  # - Requires ARBITRUM_RPC + a funded wallet; cannot run on offchain.
  signer:
    build:
      context: ..
      dockerfile: services/signer/Dockerfile
    container_name: highlights-signer
    profiles: ["signer"]
    environment:
      # Runtime-validated by the entrypoint (signer needs RPC to start).
      - ARBITRUM_RPC=${ARBITRUM_RPC:-}
      - ETH_PASSWORD=${SIGNER_PASSWORD:-testbroadcaster}
      - SIGNER_AUTH_TOKEN=${SIGNER_AUTH_TOKEN:-}
      - MAX_PRICE_PER_UNIT=${MAX_PRICE_PER_UNIT:-}
    volumes:
      # Copy the go-livepeer keystore 'wallet' file (from the app-pipelines
      # reference) into docker/keystore/ to run the signer locally.
      - ./keystore:/keystore:ro
    networks: [hl]

networks:
  hl:
    name: highlights-live

volumes:
  pgdata:
    name: highlights-pgdata
